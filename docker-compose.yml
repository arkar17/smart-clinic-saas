# Development stack: db (PostgreSQL 16), api, worker (ADR-013, same image), web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartclinic
      POSTGRES_PASSWORD: smartclinic
      POSTGRES_DB: smartclinic_dev
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclinic -d smartclinic_dev"]
      interval: 5s
      retries: 10
  api:
    image: node:22-bookworm
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sc/api dev"
    environment:
      DATABASE_URL: postgresql://smartclinic:smartclinic@db:5432/smartclinic_dev
      APP_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      IP_HASH_PEPPER: change-me-local-development-only
      IDEMPOTENCY_ENC_KEY: bG9jYWwtZGV2LW9ubHktaWRlbXBvdGVuY3kta2V5MzI=
    ports: ["3000:3000"]
    volumes: [".:/repo"]
    depends_on:
      db: { condition: service_healthy }
  worker:
    image: node:22-bookworm
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sc/api worker"
    environment:
      DATABASE_URL: postgresql://smartclinic:smartclinic@db:5432/smartclinic_dev
      IP_HASH_PEPPER: change-me-local-development-only
      IDEMPOTENCY_ENC_KEY: bG9jYWwtZGV2LW9ubHktaWRlbXBvdGVuY3kta2V5MzI=
      WORKER_ENABLED: "true"
    volumes: [".:/repo"]
    depends_on:
      db: { condition: service_healthy }
  web:
    image: node:22-bookworm
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sc/web dev"
    environment:
      API_URL: http://api:3000
    ports: ["5173:5173"]
    volumes: [".:/repo"]
    depends_on: [api]
volumes:
  db-data:
