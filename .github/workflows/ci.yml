# CI (D-08, ADR-038): lint/typecheck/unit, integration on a disposable PostgreSQL service, browser E2E (SC-5).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      # Release gate: block critical advisories; known high/moderate items are documented in docs/RELEASE.md.
      - run: pnpm audit --prod --audit-level critical

  integration:
    # Isolated, disposable PostgreSQL 16 service per run (D-08); never a shared or production database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartclinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smartclinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sc/api exec prisma migrate deploy
      - run: pnpm db:verify
      - run: pnpm test:int

  e2e:
    # SC5-BE-01 / SC5-FE-02: Playwright journeys with fictional fixtures on a disposable PostgreSQL service.
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartclinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smartclinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Playwright version as the development container; installed globally so the harness resolves it via NODE_PATH.
      - run: npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium webkit
      - run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: E2E (Chromium)
        run: pnpm test:e2e
      - name: E2E (WebKit smoke)
        run: E2E_BROWSER=webkit pnpm test:e2e
        continue-on-error: true # reported separately; not counted as passed coverage unless green
